name = "qiaomu-blog-opensource"
main = "worker.ts"
compatibility_date = "2026-04-14"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[dev]
port = 8788

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[ai]
binding = "WORKERS_AI"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "qiaomu-blog-opensource"

# Minimal resource bindings for open-source / Deploy to Cloudflare usage.
# Modern Wrangler and Deploy buttons can auto-provision these resources.
# `npm run cf:init` will replace them in `wrangler.local.toml` with concrete remote bindings.

[[d1_databases]]
binding = "DB"
database_name = "qiaomu-blog-opensource-db"
database_id = "f37a6509-5646-437d-81f3-1e55e4353159"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "qiaomu-blog-opensource-images"

# Optional Queue binding for background jobs. Uncomment after creating the queue.
# [[queues.producers]]
# binding = "BACKGROUND_QUEUE"
# queue = "nangongyuan-blog-background-jobs"
#
# [[queues.consumers]]
# queue = "nangongyuan-blog-background-jobs"

[vars]
NEXT_PUBLIC_SITE_URL = "https://blog.ngy123.com"
AI_BASE_URL = "https://api.openai.com/v1"
AI_MODEL = "gpt-4o-mini"
WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
# Optional enhancement flags. Leave unset/disabled for open-source or low-cost deployments.
# ENABLE_BACKGROUND_JOBS = "true"
# ENABLE_WORKERS_AI = "true"
# ENABLE_VECTOR_SEARCH = "true"
# ENABLE_CF_IMAGE_PIPELINE = "true"

# 伪静态边缘缓存（实现见 lib/server/edge-cache.ts，文档见 docs/d1-traffic-runbook.md）
# 默认值已够用；以下注释解开即可覆盖。D1 行读取限额告警优先考虑调这里。
# EDGE_CACHE = "off"             # 一键关闭整层
# EDGE_CACHE_TTL = "300"         # 普通页面秒数，调小则新文章更快生效
# EDGE_CACHE_TTL_FEED = "3600"   # sitemap.xml / feed.xml / robots.txt
# EDGE_CACHE_TTL_ASSET = "86400" # 静态资源

# Secrets（通过 wrangler secret put 设置）：
# - ADMIN_PASSWORD
# - ADMIN_TOKEN_SALT
# - AI_CONFIG_ENCRYPTION_SECRET
# - AI_API_KEY
# - CLOUDFLARE_ACCOUNT_ID (optional, for Workers AI model discovery)
# - CLOUDFLARE_API_TOKEN (optional, for Workers AI model discovery)
